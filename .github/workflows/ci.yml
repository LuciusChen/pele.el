name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build and test dependencies
        run: |
          if [ "$RUNNER_ARCH" = X64 ] && [ -f /etc/apt/apt-mirrors.txt ]; then
            echo 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends emacs-gtk build-essential python3 pkg-config libpango1.0-dev elpa-markdown-mode
      - name: Build and validate
        run: make -j2 check
      - name: Validate width estimates
        run: |
          make clean
          make -j2 test-renderer TEXT_BACKEND=estimate
